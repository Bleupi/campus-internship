services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433, not 5432: avoids clashing with a locally-installed
      # Postgres already listening on 127.0.0.1:5432 on dev machines.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    # Chainguard's MinIO build, not MinIO's own images: MinIO removed
    # minio/minio from Docker Hub, then locked quay.io/minio/minio too, in
    # September 2026 (both now 401 — reads like a credentials issue but the
    # images are simply no longer public). cgr.dev/chainguard/minio is a
    # free, daily-rebuilt build of the same binary (same `server` CLI and
    # env vars); only `latest` is free. It runs as nonroot (uid 65532).
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
