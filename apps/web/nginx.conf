# SPA fallback: react-router-dom handles client-side routes, so any path
# nginx can't find as a static file falls back to index.html instead of a
# 404 — the browser bundle then takes over routing.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
