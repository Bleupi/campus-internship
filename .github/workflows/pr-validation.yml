name: PR validation

# Runs on every push to an open PR (opened/synchronize/reopened are the
# default `pull_request` event types). This is the merge CI described in
# ADR-0022: lint, typecheck, build, unit tests, e2e — nothing here ever
# touches a Scaleway credential or pushes to a registry (see the same ADR's
# separate, gated deploy pipeline).
on:
  pull_request:

# Cancel a stale run when a new commit lands on the same PR.
concurrency:
  group: pr-validation-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-workflows:
    # Checks .github/ itself (ADR-0035). No path filter: a required check
    # has to report on every PR, or a PR that doesn't touch .github/ would
    # wait on it forever. Its `name:` is what main's required checks match.
    name: Lint workflows (actionlint, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No module cache: restoring it would take about as long as the build,
      # and a cache shared across PRs is one more thing to trust.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/tools/go.mod
          cache: false

      - name: actionlint
        # Built from source at the version .github/tools/go.mod pins, each
        # module checked against go.sum. Config and its justified ignores:
        # .github/actionlint.yaml.
        #
        # shellcheck (run on every `run:` script) comes preinstalled on the
        # runner. actionlint silently skips it when it's missing, so its
        # path is passed explicitly and the step fails without it. pyflakes
        # is off: no workflow has a Python `run:` script.
        run: |
          go build -C .github/tools -o "$RUNNER_TEMP/actionlint" github.com/rhysd/actionlint/cmd/actionlint
          shellcheck_path="$(command -v shellcheck)" || {
            echo "shellcheck is not installed on this runner" >&2
            exit 1
          }
          "$RUNNER_TEMP/actionlint" -color -shellcheck="$shellcheck_path" -pyflakes=

      - name: zizmor
        # No `version:` input: each zizmor-action release maps its default
        # to one zizmor image digest, so the SHA-pinned action pins zizmor,
        # and the action's Dependabot updates bring new zizmor releases.
        # Results go to annotations, not code scanning, which needs a write
        # permission. Online audits use the job's read-only token.
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true

  validate:
    name: Lint, typecheck, build, unit tests, e2e
    runs-on: ubuntu-latest

    services:
      # Service images are pinned by digest (ADR-0035): Dependabot doesn't
      # read `services:` images in workflow files, so these digests are
      # refreshed by hand, in both jobs of this file at once.
      # `docker buildx imagetools inspect <image:tag>` prints the current one.
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: stages
          POSTGRES_PASSWORD: stages
          POSTGRES_DB: stages
        ports:
          # Host port 5433, matching docker-compose.yml / .env.example's
          # DATABASE_URL, so the checked-in .env.example needs no edits.
          - 5433:5432
        options: >-
          --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5

      minio:
        # Same image docker-compose.yml uses for local dev. Its entrypoint
        # needs an explicit `server /data` command (it has no default one) —
        # the `command` key below is what makes that possible for a service
        # container (GitHub Actions added it in April 2026; previously this
        # required a custom wrapper image).
        # Chainguard's MinIO build, not MinIO's own images: MinIO removed
        # minio/minio from Docker Hub, then locked quay.io/minio/minio too,
        # in September 2026 (both now 401 — reads like a credentials issue
        # but the images are simply no longer public).
        # cgr.dev/chainguard/minio is a free, daily-rebuilt build of the same
        # binary (same `server` CLI and env vars); only `latest` is free,
        # hence the digest pinning the tag down.
        image: cgr.dev/chainguard/minio:latest@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also installs Node.js; supersedes pnpm/action-setup for pnpm v11+
      # (packageManager field).
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@24
          cache: true
          # install:true (the default) would run an unconstrained `pnpm
          # install` here, silently reconciling a drifted lockfile before the
          # --frozen-lockfile install below ever runs — defeating the point
          # of that flag. Install once, explicitly, ourselves.
          install: false

      - name: Create .env for CI
        # Mirrors the local-dev "cp .env.example .env" step (CLAUDE.md §10):
        # every value the app needs already has a working default there
        # except JWT_SECRET, which must be non-empty and >=32 chars
        # (apps/api/src/config/env.schema.ts) and is generated fresh per run
        # rather than committed, since it's a signing secret even for a
        # throwaway CI database.
        run: |
          cp .env.example .env
          sed -i "s#^JWT_SECRET=.*#JWT_SECRET=$(openssl rand -base64 48)#" .env

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - name: Build (packages/shared first, per ADR-0016)
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm --filter api run prisma migrate deploy

      - name: Wait for MinIO and create the test bucket
        # MinIO doesn't auto-create buckets; the file-upload e2e specs
        # (students.e2e-spec.ts) need S3_BUCKET (stages-files, .env.example)
        # to already exist. AWS CLI is preinstalled on ubuntu-latest runners.
        run: |
          ready=false
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && { ready=true; break; }
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "MinIO did not become ready in time" >&2
            exit 1
          fi
          aws --endpoint-url http://localhost:9000 s3 mb s3://stages-files
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: fr-par

      - name: E2e tests
        run: pnpm --filter api run test:e2e
        env:
          # .env.example ships this flag off (ADR-0029), which would leave
          # StagesModule/OrganismsModule out of the module graph and 404 their
          # e2e specs. process.env wins over .env in @nestjs/config; the
          # flag-off spec sets it to "false" itself for its own app instance.
          FEATURE_STAGE_MANAGEMENT: "true"

  container-smoke-test:
    name: Build container images and smoke-test the API image
    runs-on: ubuntu-latest

    # Same Postgres/MinIO shape as the validate job above (#22) — this job
    # runs as a separate GitHub Actions job (its own fresh runner), so
    # services can't literally be shared across jobs; this declares an
    # equivalent pair for the API container to run against.
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: stages
          POSTGRES_PASSWORD: stages
          POSTGRES_DB: stages
        ports:
          - 5433:5432
        options: >-
          --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=5

      minio:
        # Chainguard's build, not MinIO's own images — see the other minio
        # service above for why.
        image: cgr.dev/chainguard/minio:latest@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56
        command: server /data --console-address ":9001"
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build API image
        # Context is the repo root (see apps/api/Dockerfile's header comment)
        # — it COPYs packages/shared alongside apps/api. Tagged for local use
        # only: this job never pushes to a registry and never touches a
        # Scaleway credential (issue #24 acceptance criteria).
        run: docker build -f apps/api/Dockerfile -t campus-internship-api:ci .

      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t campus-internship-web:ci .

      - name: Wait for MinIO and create the test bucket
        # FilesService#onModuleInit (apps/api/src/modules/files/files.service.ts)
        # HeadBuckets on boot and, under NODE_ENV=production (set by the API
        # Dockerfile), throws instead of auto-creating a missing bucket — so
        # the container will fail to start unless the bucket already exists.
        run: |
          ready=false
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live && { ready=true; break; }
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "MinIO did not become ready in time" >&2
            exit 1
          fi
          aws --endpoint-url http://localhost:9000 s3 mb s3://stages-files
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: fr-par

      - name: Start the API image and call GET /health
        # --network host: the job's steps run directly on the runner (not in
        # a `container:`), so the postgres/minio services above are published
        # on the runner's own localhost — host networking is the simplest way
        # for a plain `docker run` container to reach them the same way it
        # would reach sibling containers in production (ADR-0022).
        #
        # Only DATABASE_URL is passed, no DATABASE_MIGRATE_URL: per
        # apps/api/docker-entrypoint.sh's own comment, that's the documented
        # fallback for a single-credential setup like this smoke test.
        run: |
          JWT_SECRET="$(openssl rand -base64 48)"
          # Same non-secret local/CI-only Postgres creds as the postgres
          # service block above (POSTGRES_USER/POSTGRES_PASSWORD: stages) and
          # .env.example's DATABASE_URL — not a real credential.
          DATABASE_URL="postgresql://stages:stages@localhost:5433/stages?schema=public" # gitleaks:allow
          container_id="$(docker run -d --network host \
            -e DATABASE_URL="$DATABASE_URL" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e S3_ENDPOINT="http://localhost:9000" \
            -e S3_BUCKET="stages-files" \
            -e S3_ACCESS_KEY_ID="minioadmin" \
            -e S3_SECRET_ACCESS_KEY="minioadmin" \
            -e S3_FORCE_PATH_STYLE="true" \
            -e API_PORT=3000 \
            -e WEB_APP_URL="http://localhost:5173" \
            -e MAILER_SCW_SECRET_KEY="ci-smoke-test-not-a-real-key" \
            -e MAILER_SCW_PROJECT_ID="ci-smoke-test-not-a-real-project" \
            -e MAILER_FROM_EMAIL="no-reply@example.org" \
            campus-internship-api:ci)"

          cleanup() {
            echo "--- API container logs ---"
            docker logs "$container_id" || true
            docker rm -f "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health; then
              ready=true
              break
            fi
            # A dead container will never answer curl — fail fast instead of
            # burning the full retry budget.
            if [ "$(docker inspect -f '{{.State.Running}}' "$container_id")" != "true" ]; then
              echo "API container exited early" >&2
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "API container did not become healthy in time" >&2
            exit 1
          fi
